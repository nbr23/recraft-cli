[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nbr23-recraft"
version = "0.1.0"
description = "Unofficial CLI for the Recraft AI image API, designed to be driven by LLM coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "nbr23", email = "max@23.tf" }]
keywords = ["recraft", "cli", "image-generation", "claude-code", "agent"]
dependencies = ["httpx>=0.27"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/nbr23/recraft-cli"
Issues = "https://github.com/nbr23/recraft-cli/issues"

[project.scripts]
recraft = "recraft:main"
# Matching the distribution name lets `uvx nbr23-recraft ...` work without --from.
nbr23-recraft = "recraft:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
only-include = ["recraft.py"]

[tool.hatch.build.targets.sdist]
include = ["recraft.py", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
